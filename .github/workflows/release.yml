name: Release

# Push a tag like v0.5.2 to publish. The zips are built here from ui-studio/,
# never by hand, and each one gets a SHA-256 checksum and a signed build
# provenance attestation that anyone can verify with:
#   gh attestation verify ui-studio.zip --repo SkillsHunter/ui-studio

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Tag must match the newest CHANGELOG entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          top=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4-)
          if [ "v$top" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the newest CHANGELOG entry ($top)."
            exit 1
          fi

      - name: Test
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          python -m pytest -m "not render"

      - name: Build
        run: python tools/build.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ui-studio.zip
            dist/ui-studio-single-file.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Verify your download"
            echo '```'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify ui-studio.zip --repo ${{ github.repository }}"
            echo '```'
          } >> notes.md
          gh release create "$TAG" dist/ui-studio.zip dist/ui-studio-single-file.zip dist/SHA256SUMS \
            --title "UI Studio $version" --notes-file notes.md --verify-tag
